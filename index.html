<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>はむこばのhamちゃんの習慣冒険記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#070210;background-image:radial-gradient(#1a0a3a 20%, transparent 20%), radial-gradient(#1a0a3a 20%, transparent 20%);background-size:8px 8px;background-position:0 0, 4px 4px;display:flex;justify-content:center;padding:12px;min-height:100vh}
.rpg{font-family:'DotGothic16',monospace;background:#140727;color:#f0e6c8;padding:8px;width:100%;max-width:540px;font-size:14px;box-shadow:0 0 20px rgba(0,0,0,0.8)}
.rb{border:4px double #8b6914;outline:2px solid #f0c040;padding:7px;background:#090215;position:relative}
.ttl-area{display:flex;justify-content:space-between;align-items:center;background:#1a0a2e;border-bottom:2px solid #8b6914;padding:3px 8px;margin-bottom:7px}
.ttl{font-size:12px;color:#f0c040;letter-spacing:2px;font-weight:bold}
.mute-btn{background:#0d0520;border:1px solid #8b6914;color:#f0c040;font-family:'DotGothic16',monospace;font-size:10px;cursor:pointer;padding:2px 6px}
.mute-btn.active{background:#8b6914;color:#0d0520}
.tabs{display:flex;border:2px solid #8b6914;margin-bottom:7px;background:#0d0520}
.tb{flex:1;padding:8px 1px;background:transparent;border:none;color:#6a5a4a;font-family:'DotGothic16',monospace;font-size:11px;cursor:pointer;border-right:1px solid #4a3a6a;position:relative;outline:none}
.tb:last-child{border-right:none}
.tb:hover{color:#f0e6c8}
.tb:hover::before{content:"▶";position:absolute;left:2px;color:#f0c040;font-size:9px}
.tb.active{background:#2a1a3e;color:#f0c040}
.tb.active::before{content:"👉";position:absolute;left:1px;font-size:10px}
.scr{display:none}.scr.active{display:block}
.panel{background:#080212;border:2px solid #8b6914;padding:7px;margin-bottom:7px;box-shadow:inset 0 0 10px rgba(0,0,0,0.8)}
.ptl{color:#f0c040;font-size:11px;letter-spacing:1px;margin-bottom:5px;border-bottom:1px solid #4a3a6a;padding-bottom:3px;display:flex;align-items:center}
.ptl::before{content:"▼ ";color:#8b6914;margin-right:2px}
.hero-layout{display:flex;gap:10px;margin-bottom:6px}
.hero-img-box{width:76px;height:76px;border:2px solid #8b6914;background:#0d0520;padding:2px;display:flex;align-items:center;justify-content:center;image-rendering:pixelated}
.hero-img{width:100%;height:100%;object-fit:contain}
.hero-stats{flex:1;display:flex;flex-direction:column;gap:3px}
.hero-name-row{display:flex;justify-content:space-between;align-items:baseline}
.hero-name{font-size:14px;color:#f0c040;font-weight:bold}
.hero-lv{font-size:11px;color:#a0c8f0}
.flavor-stats{display:flex;gap:8px;font-size:9px;color:#8a7a6a;margin-top:2px}
.fs-val{color:#f0e6c8}
.srow{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.slbl{font-size:9px;width:24px;color:#a0c8f0;font-weight:bold}
.bbg{flex:1;height:12px;background:#1a0a2e;border:1px solid #4a3a6a;padding:1px;position:relative}
.bf{height:100%;transition:width .3s}
.bhp{background:linear-gradient(to right, #a02020, #e04040)}
.bmp{background:linear-gradient(to right, #2040a0, #4080f0)}
.bex{background:linear-gradient(to right, #a08020, #f0c040)}
.sval{font-size:9px;min-width:32px;text-align:right}
.ri{background:#1a0a2e;border:1px solid #8b6914;color:#f0e6c8;font-family:'DotGothic16',monospace;font-size:13px;padding:4px 5px;width:58px;text-align:center}
.ri:focus{outline:2px solid #f0c040}
.rbtn{background:#2a1a3e;border:2px solid #8b6914;color:#f0c040;font-family:'DotGothic16',monospace;font-size:11px;cursor:pointer;padding:6px 10px;position:relative}
.rbtn:hover{background:#3a2a4e;color:#fff}
.rbtn:hover::before{content:"▶";position:absolute;left:2px;font-size:8px;top:50%;transform:translateY(-50%)}
.rbtn.ok{border-color:#40a000;color:#80d040}
.rbtn.ok:hover{background:#1e3d0c}
.rbtn.cl{border-color:#802020;color:#d04040;margin-left:5px}
.rbtn.cl:hover{background:#3d0c0c}
.qcat-tab{opacity:.5;font-size:11px;padding:8px 4px}
.qcat-tab.active{opacity:1;background:#3a2a4e;color:#fff;border-color:#f0c040}
.lock-banner{background:#3a0a0a;border:2px solid #802020;color:#d04040;font-size:10px;padding:6px;margin-bottom:6px;text-align:center;font-weight:bold}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.qcard{background:#0d0520;border:2px solid #4a3a6a;padding:8px 6px;cursor:pointer;text-align:center;position:relative;transition:all 0.2s}
.qcard:hover{border-color:#f0c040;background:#150a2e}
.qcard:hover::after{content:"👉";position:absolute;top:2px;left:2px;font-size:10px}
.qcard.hasdone{border-color:#f0c040;background:linear-gradient(135deg, #1a1200 0%, #0d0520 100%)}
.qcard.exq{border-color:#d04080}
.qcard.locked{opacity:.35;cursor:not-allowed}
.qcard.locked:hover::after{display:none}
.qi{font-size:24px;margin-bottom:2px}
.qn{font-size:15px;color:#f0e6c8;letter-spacing:1px;font-weight:bold}
.qdone{font-size:9px;color:#80d040;margin-top:3px;word-break:break-all}
.qst{font-size:9px;padding:2px 4px;display:inline-block;margin-top:4px}
.sdone{background:#2a4a00;color:#80d040;border:1px solid #40a000}
.snot{background:#2a0a0a;color:#a04040;border:1px solid #602020}
.qlk{font-size:9px;color:#a04040;margin-top:3px}
.modal-bg{background:#0a0518;border:3px double #f0c040;outline:2px solid #8b6914;padding:8px;margin-bottom:7px;box-shadow:0 0 15px rgba(0,0,0,0.9);display:flex;flex-direction:column;gap:8px;width:100%;max-width:100%;box-sizing:border-box;overflow:hidden}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px 10px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-overlay .modal-bg{width:100%;max-width:640px;margin-bottom:0;max-height:calc(100vh - 32px);overflow-y:auto;padding:16px}
.modal-overlay .mttl{font-size:19px;margin-bottom:10px;padding-bottom:6px;color:#ffd76a}
.modal-overlay .si-container{flex-direction:column;overflow-x:hidden;overflow-y:visible;padding-bottom:0}
.modal-overlay .si{width:100%;box-sizing:border-box;padding:11px;gap:8px;border-width:2px}
.modal-overlay .sck{min-width:96px;font-size:15px;padding:9px 12px}
.modal-overlay .sname{font-size:17px;margin-bottom:5px;color:#c2e0ff}
.modal-overlay .exmp{font-size:13px;margin-bottom:6px;color:#ff8fc4}
.modal-overlay .fld label{font-size:12px;color:#e0d4c0}
.modal-overlay .fld input.ri{width:78px;font-size:17px;padding:7px 8px;color:#fff8ea}
.modal-overlay .rbtn{font-size:16px;padding:11px 12px}
.modal-overlay .ybtn{font-size:17px;padding:15px}
.mttl{color:#f0c040;font-size:13px;margin-bottom:6px;text-align:center;border-bottom:1px solid #4a3a6a;padding-bottom:3px;letter-spacing:1px}
.si-container{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;width:100%;min-width:0}
.si-container::-webkit-scrollbar{height:4px}
.si-container::-webkit-scrollbar-track{background:#0d0520}
.si-container::-webkit-scrollbar-thumb{background:#8b6914;border-radius:2px}
.si{display:flex;align-items:flex-start;gap:5px;padding:5px;border:1px solid #4a3a6a;background:#090215;transition:border-color 0.2s;flex:0 0 170px}
.si:hover{border-color:#8b6914}
.si.done{border-color:#f0c040;background:#1a1200}
.sck{width:auto;min-width:60px;height:auto;border:2px solid #8b6914;background:#1a0a2e;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:#f0c040;flex-shrink:0;margin-top:1px;padding:5px 8px;font-weight:bold;white-space:nowrap;text-align:center}
.sck.done{background:#2a4a00;border-color:#40a000;color:#80d040}
.sname{font-size:12px;color:#a0c8f0;margin-bottom:2px;font-weight:bold}
.exmp{font-size:8px;color:#d04080;margin-bottom:3px}
.fields{display:flex;gap:4px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;align-items:center;gap:1px}
.fld label{font-size:8px;color:#6a5a4a}
.ybtn{flex:1;padding:8px;border:2px solid;font-family:'DotGothic16',monospace;font-size:12px;cursor:pointer;position:relative}
.ybtn:hover::before{content:"👉";position:absolute;left:4px;font-size:10px}
.ybtn.yes{background:#1a3010;border-color:#40a000;color:#80d040}
.ybtn.no{background:#3a0a0a;border-color:#802020;color:#d04040}
.ybtn.sel{outline:3px solid #f0c040}
.rec-row{font-size:9px;color:#6a5a4a;margin-bottom:3px;padding:3px;border-bottom:1px solid #1a0a3a;word-break:break-all}
.rv{color:#a0c8f0}
.msg-box{background:#000;border:4px double #8b6914;outline:2px solid #f0c040;padding:7px;font-size:11px;color:#f0e6c8;min-height:45px;line-height:1.6;position:relative}
.msg-box::before{content:"";position:absolute;top:3px;left:3px;right:3px;bottom:3px;border:1px solid #3a2a1a;pointer-events:none}
.cur{display:inline-block;width:7px;height:10px;background:#f0e6c8;animation:bl .7s infinite;margin-left:3px;vertical-align:middle}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.cal-ttl{color:#f0c040;font-size:11px}
.cnav{background:#1a0a2e;border:1px solid #8b6914;color:#f0c040;font-family:'DotGothic16',monospace;font-size:11px;cursor:pointer;padding:2px 7px}
.cnav:hover{background:#2a1a3e}
.ctabs{display:flex;gap:4px;margin-bottom:6px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.ctabs::-webkit-scrollbar{height:4px}
.ctabs::-webkit-scrollbar-track{background:#0d0520}
.ctabs::-webkit-scrollbar-thumb{background:#8b6914;border-radius:2px}
.ctab{background:#1a0a2e;border:1px solid #4a3a6a;color:#a0c8f0;font-family:'DotGothic16',monospace;font-size:10px;cursor:pointer;padding:4px 8px;flex:0 0 auto}
.ctab.active{background:#f0c040;color:#1a0a2e;border-color:#f0c040}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:9px;color:#4a3a6a;margin-bottom:2px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cd{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:#4a3a6a;border:1px solid transparent;line-height:1.15;padding:1px 0}
.c-num{font-size:9px;font-weight:bold}
.c-status{font-size:7px;transform:scale(0.85);margin-top:1px;white-space:nowrap;display:inline-block}
.cd.today{color:#f0e6c8;border-color:#f0c040}
.cd.c1{background:#1a3010;color:#60a030}
.cd.c2{background:#2a5020;color:#80c040}
.cd.c3{background:#3a7030;color:#a0d060}
.cd.call{background:#f0c040;color:#1a0a2e}
.cd.abs-yes{background:#1a2a4a;color:#6090d0}
.cd.abs-no{background:#3a0a0a;color:#a04040}
.gr{display:flex;align-items:center;gap:5px;margin-bottom:4px;flex-wrap:nowrap;width:100%}
.glbl{font-size:12px;color:#a0c8f0;width:65px;font-weight:bold;flex-shrink:0}
.gr .ri{width:46px;padding:3px;flex-shrink:0}
.gunit{font-size:9px;color:#6a5a4a;width:32px;flex-shrink:0}
.gprog{font-size:10px;color:#80d040;margin-left:auto;text-align:right;flex-grow:1;min-width:50px;font-weight:bold}
.rulehint{font-size:9px;color:#5a7a3a;margin-top:5px;padding:4px;border:1px solid #2a4a1a;background:#0a1a05}
.grow{margin-bottom:11px;padding-bottom:9px;border-bottom:1px solid #2a1a3e}
.grow:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0}
.gr-bar-wrap{display:flex;align-items:center;gap:6px}
.gr-bar-wrap .bbg{height:10px}
.gr-bar-fill{background:linear-gradient(to right,#a08020,#f0c040)}
.grow.achieved .gr-bar-fill{background:linear-gradient(to right,#2a6010,#80d040);box-shadow:0 0 6px rgba(128,208,64,.6)}
.gr-bar-txt{font-size:9px;color:#8a7a6a;white-space:nowrap;min-width:76px;text-align:right}
.mission-flash{position:fixed;inset:0;background:#fff;z-index:2100;animation:missionFlash .45s ease-out forwards;pointer-events:none}
@keyframes missionFlash{0%{opacity:.95}100%{opacity:0}}
.mission-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
.mission-card{animation:missionPop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes missionPop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.mission-title{font-size:clamp(28px,9vw,44px);font-weight:bold;letter-spacing:2px;margin-bottom:14px;color:#f0c040;text-shadow:0 0 24px rgba(240,192,64,.9),3px 3px 0 #000,-1px -1px 0 #000;animation:missionShake .35s ease-in-out 3}
.mission-title.monthly{color:#ff6fa8;text-shadow:0 0 24px rgba(255,111,168,.9),3px 3px 0 #000,-1px -1px 0 #000}
@keyframes missionShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-2.5deg)}75%{transform:rotate(2.5deg)}}
.mission-sub{font-size:clamp(15px,4.5vw,20px);color:#fff;margin-bottom:26px;text-shadow:2px 2px 0 #000,-1px -1px 0 #000;font-weight:bold;letter-spacing:1px}
.mission-btn{background:#2a1a3e;border:3px double #f0c040;outline:2px solid #8b6914;color:#f0c040;font-family:'DotGothic16',monospace;font-size:15px;cursor:pointer;padding:12px 30px}
.mission-btn:hover{background:#3a2a4e;color:#fff}
.boss-card{border:2px solid #8b6914;background:#0d0520;padding:6px;margin-bottom:8px;display:flex;gap:10px}
.boss-img-box{width:76px;height:76px;border:1px solid #802020;background:#1a0505;display:flex;align-items:center;justify-content:center;image-rendering:pixelated;flex-shrink:0}
.boss-img{width:100%;height:100%;object-fit:contain;transition:filter 0.5s}
.boss-img.defeated{filter:grayscale(100%) brightness(40%);opacity:0.6}
.boss-info{flex:1;display:flex;flex-direction:column;justify-content:center}
.boss-name{color:#e04040;font-size:12px;font-weight:bold;margin-bottom:3px}
.boss-hp-bg{height:10px;background:#3a0a0a;border:1px solid #802020;position:relative;margin-bottom:3px}
.boss-hp-bar{height:100%;background:linear-gradient(to right, #801010, #e04040);transition:width 0.5s}
.boss-hp-txt{display:flex;justify-content:space-between;font-size:8px;color:#e04040}
.boss-meta{font-size:8px;color:#6a5a4a;margin-top:2px}
.survey-hero-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:8px}
.survey-hero-box{width:120px;height:120px;border:3px double #8b6914;outline:2px solid #f0c040;background:#0d0520;padding:4px;display:flex;align-items:center;justify-content:center;position:relative;transition:box-shadow .4s ease,transform .4s ease}
.survey-hero-img{width:100%;height:100%;object-fit:contain;transition:filter .4s ease}
.survey-hero-box.charging::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle, rgba(240,192,64,.55), transparent 70%);animation:surveyChargePulse 1.1s infinite;pointer-events:none}
@keyframes surveyChargePulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}
.survey-charge-bar{width:120px;height:8px;background:#1a0a2e;border:1px solid #4a3a6a;margin-top:7px;position:relative;overflow:hidden}
.survey-charge-fill{height:100%;background:linear-gradient(to right,#a08020,#f0c040,#fff8c0);transition:width .4s ease}
.survey-charge-txt{font-size:9px;color:#f0c040;margin-top:3px;letter-spacing:1px}
@media (max-width:480px){
body{padding:8px}
.rpg{padding:6px}
.tb{font-size:11px;padding:8px 1px}
.tb:hover::before, .tb.active::before{display:none}
.qi{font-size:20px}
.qn{font-size:13px}
.hero-img-box{width:64px;height:64px}
.boss-img-box{width:64px;height:64px}
}
</style>
</head>
<body>
<div class="rpg"><div class="rb">
<div class="ttl-area">
  <div class="ttl">はむこばのhamちゃん　冒険記録</div>
  <button class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊 音ON</button>
</div>

<div class="tabs">
  <button class="tb active" onclick="sw('today')">TODAY</button>
  <button class="tb" onclick="sw('calendar')">RECORD</button>
  <button class="tb" onclick="sw('goals')">GOALS</button>
  <button class="tb" onclick="sw('boss')">BOSS</button>
</div>

<div id="s-today" class="scr active">
  <div class="panel">
    <div class="ptl">ステータス（毎朝入力）</div>
    <div class="hero-layout">
      <div class="hero-img-box">
        <img class="hero-img" id="hero-avatar" src="hamちゃん勇者.png" alt="勇者">
      </div>
      <div class="hero-stats">
        <div class="hero-name-row">
          <span class="hero-name">はむこばのhamちゃん</span>
          <span class="hero-lv" id="hero-lv">LV. 1</span>
        </div>
        <div class="srow">
          <div class="slbl">HP</div>
          <div class="bbg"><div class="bf bhp" id="b-hp" style="width:80%"></div></div>
          <div class="sval" id="t-hp">80</div>
        </div>
        <div class="srow">
          <div class="slbl">MP</div>
          <div class="bbg"><div class="bf bmp" id="b-mp" style="width:60%"></div></div>
          <div class="sval" id="t-mp">60</div>
        </div>
        <div class="srow">
          <div class="slbl">本日</div>
          <div class="bbg"><div class="bf bex" id="b-exp" style="width:0%"></div></div>
          <div class="sval" id="t-exp">0/5</div>
        </div>
        <div class="flavor-stats">
          <span>ちから:<span class="fs-val" id="fs-str">10</span></span>
          <span>まもり:<span class="fs-val" id="fs-def">8</span></span>
          <span>すばやさ:<span class="fs-val" id="fs-agi">12</span></span>
          <span>🔥連続:<span class="fs-val" id="fs-streak">0</span>日</span>
        </div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:6px">
      <input class="ri" style="flex:1;width:0;min-width:50px" type="number" id="i-hp" placeholder="HP" min="0" max="100">
      <input class="ri" style="flex:1;width:0;min-width:50px" type="number" id="i-mp" placeholder="MP" min="0" max="100">
      <button class="rbtn ok" style="flex:1.5;white-space:nowrap;padding:6px 2px" onclick="setStatus()">朝の記録</button>
    </div>
    <button class="rbtn" style="width:100%;margin-top:5px;font-size:10px" onclick="openSurvey()">🔮 HP/MP診断</button>
    <div class="rulehint">MPが30未満だと運動以外ロック。運動するとMP回復＋HP消費</div>
  </div>

  <div id="lock-area"></div>
  <div id="modal-area"></div>
  <div id="survey-area"></div>

  <div class="panel">
    <div class="ptl">▼ クエスト</div>
    <div style="display:flex;gap:6px;margin-bottom:8px">
      <button class="rbtn qcat-tab active" id="qcat-main-btn" onclick="switchQCat('main')" style="flex:1">⚔ メインクエスト</button>
      <button class="rbtn qcat-tab" id="qcat-sub-btn" onclick="switchQCat('sub')" style="flex:1">📋 サブクエスト</button>
    </div>
    <div class="qgrid" id="qgrid-main"></div>
    <div class="qgrid" id="qgrid-sub" style="display:none"></div>
  </div>

  <div class="panel">
    <div class="ptl">▼ 本日の記録</div>
    <div id="rec-list"><div style="font-size:9px;color:#4a3a6a">クエストをこなして記録しよう</div></div>
  </div>

  <div class="panel">
    <div class="ptl">▼ 宿屋</div>
    <div id="inn-area"></div>
  </div>
</div>

<div id="s-calendar" class="scr">
  <div class="panel">

// 効果音クラス
class Sound {
  static ctx = null;
  static muted = false;

  static init() {
    if (!this.ctx) {
      try {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      } catch(e) {
        console.warn('Web Audio API not supported');
      }
      this.muted = localStorage.getItem('rpgYuuki_muted') === 'true';
    }
  }

  static play(type) {
    if (!hasInteracted) return; // ユーザー操作があるまでは音を鳴らさない
    this.init();
    if (this.muted) return;
    if (this.ctx && this.ctx.state === 'suspended') {
      this.ctx.resume().catch(() => {});
    }
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    
    switch(type) {
      case 'select': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(800, t);
        osc.frequency.exponentialRampToValueAtTime(1200, t + 0.05);
        gain.gain.setValueAtTime(0.015, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.05);
        break;
      }
      case 'confirm': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(600, t);
        osc.frequency.setValueAtTime(900, t + 0.06);
        osc.frequency.setValueAtTime(1200, t + 0.12);
        gain.gain.setValueAtTime(0.015, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.18);
        break;
      }
      case 'cancel': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(350, t);
        osc.frequency.setValueAtTime(250, t + 0.08);
        gain.gain.setValueAtTime(0.02, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
        break;
      }
      case 'damage': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(300, t);
        osc.frequency.exponentialRampToValueAtTime(50, t + 0.15);
        gain.gain.setValueAtTime(0.03, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.15);
        break;
      }
      case 'heal': {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, t + idx * 0.05);
          gain.gain.setValueAtTime(0.015, t + idx * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.05 + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + idx * 0.05);
          osc.stop(t + idx * 0.05 + 0.12);
        });
        break;
      }
      case 'levelUp': {
        const notes = [523.25, 659.25, 783.99, 523.25, 783.99, 1046.50];
        const durs = [0.1, 0.1, 0.1, 0.08, 0.08, 0.4];
        let cur = 0;
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(freq, t + cur);
          gain.gain.setValueAtTime(0.015, t + cur);
          gain.gain.exponentialRampToValueAtTime(0.001, t + cur + durs[idx]);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(t + cur);
          osc.stop(t + cur + durs[idx]);
          cur += durs[idx] * 0.8;
        });
        break;
      }
      case 'talk': {
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(700, t);
        gain.gain.setValueAtTime(0.005, t);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.03);
        break;
      }
    }
  }
}

function getInnTotal(){return Object.keys(D.innDone).filter(d=>D.innDone[d]).length;}
function getInnStreak(){
  let d=new Date(TODAY);
  if(!D.innDone[dk(d)])d.setDate(d.getDate()-1);
  let s=0;
  while(D.innDone[dk(d)]){s++;d.setDate(d.getDate()-1);}
  return s;
}
function getLevel(){
  const tot=QUESTS.filter(q=>q.special!=='nodrink').reduce((s,q)=>{
    return s+Object.keys(D.subRec).filter(day=>{
      const r=D.subRec[day][q.id];
      return r&&Object.values(r).some(x=>x&&x._done);
    }).length;
  },0)+Object.values(D.nodrink).filter(v=>v==='yes').length;
  const lv=1+getInnTotal();
  const todayDone=QUESTS.filter(q=>questDone(q.id)).length;
  const todayTotal=QUESTS.length;
  return{lv,tot,todayDone,todayTotal};
}
function isLocked(){return(D.status[TDK]||{mp:60}).mp<MP_THRESHOLD;}
function questDone(qid){
  if(qid==='nodrink')return D.nodrink[TDK]==='yes';
  const r=D.subRec[TDK][qid];
  return r&&Object.values(r).some(s=>s&&s._done);
}
function subDoneNames(qid){
  const r=D.subRec[TDK][qid];if(!r)return[];
  const q=QUESTS.find(x=>x.id===qid);
  return Object.entries(r).filter(([,v])=>v&&v._done).map(([k])=>{const s=q.subs.find(x=>x.id===k);return s?s.name:'';}).filter(Boolean);
}

  surveyAnswers={};
  renderSurveyModal();
}
function renderSurveyModal(){
  const allAnswered=SURVEY.every(q=>surveyAnswers[q.id]!=null);
  const answered=SURVEY.filter(q=>surveyAnswers[q.id]!=null).length;
  const total=SURVEY.length;
  const progress=answered/total;
  const glow=Math.round(6+progress*34);
  const scale=(1+progress*0.12).toFixed(2);
  const boxShadow=progress>0?`box-shadow:0 0 ${glow}px ${Math.round(glow/2)}px rgba(240,192,64,${(0.25+progress*0.55).toFixed(2)});`:'';
  const brightness=(1+progress*0.25).toFixed(2);
  const saturate=(1+progress*0.3).toFixed(2);
  document.getElementById('survey-area').innerHTML=`<div class="modal-bg">
    <div class="mttl">🌅 今日の調子アンケート</div>
    <div class="survey-hero-wrap">
      <div class="survey-hero-box${progress>0?' charging':''}" style="transform:scale(${scale});${boxShadow}">
        <img class="survey-hero-img" src="リアル勇者.png" alt="リアル勇者" style="filter:brightness(${brightness}) saturate(${saturate})">
      </div>
      <div class="survey-charge-bar"><div class="survey-charge-fill" style="width:${Math.round(progress*100)}%"></div></div>
      <div class="survey-charge-txt">POWER ${answered}/${total}${progress>=1?' ★満タン！':''}</div>
    </div>
    ${SURVEY.map(q=>`
      <div style="margin-bottom:6px">
        <div style="font-size:11px;color:#a0c8f0;margin-bottom:4px">${q.q}</div>
        <div style="display:flex;flex-direction:column;gap:4px">
          ${q.opts.map((o,i)=>`<button class="rbtn${surveyAnswers[q.id]===i?' ok':''}" style="width:100%;text-align:left;font-size:10px;padding:6px 8px" onclick="selectSurvey('${q.id}',${i})">${surveyAnswers[q.id]===i?'▶ ':''}${o.l}</button>`).join('')}
        </div>
      </div>`).join('')}
    <div style="display:flex;gap:8px;width:100%">
      <button class="rbtn ok" style="flex:1${allAnswered?'':';opacity:.35;cursor:not-allowed'}"${allAnswered?'':' disabled'} onclick="finishSurvey()">▶ 診断結果を見る</button>
      <button class="rbtn cl" style="flex:1;margin-left:0" onclick="skipSurvey()">✕ 手動で入力する</button>
    </div>
  </div>`;
}
function selectSurvey(id,i){
  Sound.play('select');
  surveyAnswers[id]=i;
  renderSurveyModal();
}
function skipSurvey(){
  Sound.play('cancel');
  D.surveyDone[TDK]=true;sv();
  document.getElementById('survey-area').innerHTML='';
}
function finishSurvey(){
  if(!SURVEY.every(q=>surveyAnswers[q.id]!=null))return;
  Sound.play('confirm');
  let hp=SURVEY_BASE_HP,mp=SURVEY_BASE_MP;
  SURVEY.forEach(q=>{const o=q.opts[surveyAnswers[q.id]];hp+=o.hp;mp+=o.mp;});
  hp=clamp(hp);mp=clamp(mp);
  D.status[TDK]={hp,mp};
  D.surveyDone[TDK]=true;
  sv();
  document.getElementById('survey-area').innerHTML='';
  document.getElementById('i-hp').value=hp;
  document.getElementById('i-mp').value=mp;
  renderHero();renderGrid();
  showMsg('診断結果！HP:'+hp+' MP:'+mp+(mp<MP_THRESHOLD?' → MP不足、まず運動から始めよう！':' → 今日も一日頑張ろう！'));
  setTimeout(()=>Sound.play('heal'),200);
}

function switchQCat(cat){
  Sound.play('select');
  document.getElementById('qgrid-main').style.display=cat==='main'?'':'none';
  document.getElementById('qgrid-sub').style.display=cat==='sub'?'':'none';
  document.getElementById('qcat-main-btn').classList.toggle('active',cat==='main');
  document.getElementById('qcat-sub-btn').classList.toggle('active',cat==='sub');
}
function renderGrid(){
  const gMain=document.getElementById('qgrid-main');
  const gSub=document.getElementById('qgrid-sub');
  const locked=isLocked();
  
  const renderCard = q => {
    const isEx=q.special==='exercise';
    const lockedThis=!isEx&&locked;
    if(q.special==='nodrink'){
      const ans=D.nodrink[TDK];
      return`<div class="qcard${ans==='yes'?' hasdone':''}${lockedThis?' locked':''}" onclick="${lockedThis?'':"openModal('nodrink')"}">
        <div class="qi">${q.icon}</div><div class="qn">${q.name}</div>
        ${lockedThis?'<div class="qlk">🔒ロック</div>':`<div class="qst ${ans==='yes'?'sdone':'snot'}">${ans==='yes'?'★禁酒':ans==='no'?'✕飲酒':'選択▶'}</div>`}
      </div>`;
    }
    const done=questDone(q.id);
    const names=subDoneNames(q.id);
    return`<div class="qcard${done?' hasdone':''}${isEx?' exq':''}${lockedThis?' locked':''}" onclick="${lockedThis?'':"openModal('"+q.id+"')"}">
      <div class="qi">${q.icon}</div><div class="qn">${q.name}</div>
      ${isEx?'<div class="qlk" style="color:#d04080">MP回復係</div>':''}
      ${names.length?`<div class="qdone">✓${names.join(' ✓')}</div>`:''}
      ${lockedThis?'<div class="qlk">🔒MP不足</div>':`<div class="qst ${done?'sdone':'snot'}">${done?'★完了':'タップ▶'}</div>`}
    </div>`;
  };

  if (gMain) gMain.innerHTML=QUESTS.filter(q=>q.category==='main').map(renderCard).join('');
  if (gSub) gSub.innerHTML=QUESTS.filter(q=>q.category==='sub').map(renderCard).join('');
}

function openModal(qid){
  activeQ=qid;
  if(qid==='nodrink'){renderNodrinkModal();return;}
  const q=QUESTS.find(x=>x.id===qid);
  const rec=D.subRec[TDK][qid]||{};
  const isEx=q.special==='exercise';
  document.body.style.overflow='hidden';
  document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay" onclick="if(event.target.id==='modal-overlay')closeModal(false)"><div class="modal-bg">
    <div class="mttl">【${q.icon} ${q.name}】アクション</div>
    <div class="si-container">
      ${q.subs.map(s=>{
        const sr=rec[s.id]||{};const done=!!sr._done;
        return`<div class="si${done?' done':''}">
          <div class="sck${done?' done':''}" onclick="toggleSub('${qid}','${s.id}')">${done?'✓ 完了！':'未完了'}</div>
          <div style="flex:1">
            <div class="sname">${s.icon} ${s.name}</div>
            ${isEx?`<div class="exmp">MP+${s.mp} / HP${s.hp}</div>`:''}
            <div class="fields">${s.fields.map(f=>`<div class="fld"><label>${f.l}</label>
              <input class="ri" style="width:58px" type="text" id="f-${s.id}-${f.k}" value="${sr[f.k]||''}" placeholder="0"
                onclick="event.stopPropagation()" onchange="saveF('${qid}','${s.id}','${f.k}',this.value)"></div>`).join('')}</div>
          </div>
        </div>`;
      }).join('')}
    </div>
    <div style="display:flex;gap:8px;margin-top:5px;width:100%">
      <button class="rbtn ok" style="flex:1" onclick="closeModal(true)">▶ 記録して閉じる</button>
      <button class="rbtn cl" style="flex:1;margin-left:0" onclick="closeModal(false)">✕ 閉じる</button>
    </div>
  </div></div>`;
  showMsg(q.name+'のアクションを記録しよう！');
}
function renderNodrinkModal(){
  const ans=D.nodrink[TDK];
  document.body.style.overflow='hidden';
  document.getElementById('modal-area').innerHTML=`<div class="modal-overlay" id="modal-overlay" onclick="if(event.target.id==='modal-overlay')closeModal(false)"><div class="modal-bg">
    <div class="mttl">【🚫 禁酒】今日はどうする？</div>
    <div style="display:flex;gap:6px;margin-bottom:7px">
      <button class="ybtn yes${ans==='yes'?' sel':''}" onclick="setNodrink('yes')">✓ 禁酒する</button>
      <button class="ybtn no${ans==='no'?' sel':''}" onclick="setNodrink('no')">✕ 飲む</button>
    </div>
    <button class="rbtn cl" onclick="closeModal(false)">✕ 閉じる</button>
  </div></div>`;
}
function setNodrink(val){
  Sound.play('confirm');
  D.nodrink[TDK]=val;sv();
  showMsg(val==='yes'?'禁酒達成！今月'+getAbsMonth()+'日目！意志の力が増す！':'今日は飲む日。記録は正直につけよう。');
  renderNodrinkModal();renderGrid();renderHero();renderSummary();
}
function getAbsWeek(){const d=new Date(TODAY);d.setDate(d.getDate()-d.getDay());let c=0;for(let i=0;i<7;i++){const dd=new Date(d);dd.setDate(d.getDate()+i);if(D.nodrink[dk(dd)]==='yes')c++;}return c;}
function getAbsMonth(){let c=0;const y=TODAY.getFullYear(),m=TODAY.getMonth();for(let i=1;i<=31;i++){const d=new Date(y,m,i);if(d.getMonth()!==m)break;if(D.nodrink[dk(d)]==='yes')c++;}return c;}
function getAbsStreak(){let d=new Date(TODAY);let s=0;while(D.nodrink[dk(d)]==='yes'){s++;d.setDate(d.getDate()-1);}return s;}
function getTotalAbs(){return Object.values(D.nodrink).filter(v=>v==='yes').length;}

function saveF(qid,sid,key,val){
  if(!D.subRec[TDK][qid])D.subRec[TDK][qid]={};
  if(!D.subRec[TDK][qid][sid])D.subRec[TDK][qid][sid]={};
  D.subRec[TDK][qid][sid][key]=val;sv();
}
function toggleSub(qid,sid){
  if(!D.subRec[TDK][qid])D.subRec[TDK][qid]={};
  if(!D.subRec[TDK][qid][sid])D.subRec[TDK][qid][sid]={};
  const wasDone=D.subRec[TDK][qid][sid]._done;
  const isDone = !wasDone;
  D.subRec[TDK][qid][sid]._done=isDone;
  const q=QUESTS.find(x=>x.id===qid);
  const s=q.subs.find(x=>x.id===sid);
  let msg='';

  if(isDone){
    Sound.play('confirm');
    const r=D.subRec[TDK][qid][sid];
    const detail=s.fields.map(f=>r[f.k]?f.l+':'+r[f.k]:'').filter(Boolean).join(' ');
    msg=q.name+'▶'+s.name+'完了！'+detail;
    if(q.special==='exercise'){
      Sound.play('damage');
      setTimeout(() => Sound.play('heal'), 150);
      const st=D.status[TDK]||{hp:80,mp:60};
      const beforeHP=st.hp,beforeMP=st.mp;
      const wasLocked=st.mp<MP_THRESHOLD;
      st.mp=clamp(st.mp+s.mp);
      st.hp=clamp(st.hp+s.hp);
      D.status[TDK]=st;
      msg+=' → HP'+beforeHP+'→'+st.hp+' MP'+beforeMP+'→'+st.mp;
      if(wasLocked&&st.mp>=MP_THRESHOLD)msg+=' ★ロック解除！全クエスト解放！';
    }
  } else {
    Sound.play('cancel');
    msg=q.name+'▶'+s.name+'を未完了に戻しました。';
    if(q.special==='exercise'){
      const st=D.status[TDK]||{hp:80,mp:60};
      const beforeHP=st.hp,beforeMP=st.mp;
      st.mp=clamp(st.mp-s.mp);
      st.hp=clamp(st.hp-s.hp);
      D.status[TDK]=st;
      msg+=' → HP'+beforeHP+'→'+st.hp+' MP'+beforeMP+'→'+st.mp;
      if(st.mp<MP_THRESHOLD)msg+=' ⚠️MP不足により、運動以外がロックされました';
    }
  }
  
  sv();openModal(qid);renderGrid();renderHero();renderSummary();
  showMsg(msg||'更新した');
}
function closeModal(doSave){
  if(doSave&&activeQ&&activeQ!=='nodrink'){
    Sound.play('confirm');
    const q=QUESTS.find(x=>x.id===activeQ);
    q.subs.forEach(s=>s.fields.forEach(f=>{
      const el=document.getElementById('f-'+s.id+'-'+f.k);
      if(el&&el.value)saveF(activeQ,s.id,f.k,el.value);
    }));
    sv();renderGrid();renderSummary();showMsg('記録保存！積み上げが続く！');
  } else {
    Sound.play('cancel');
  }
  document.getElementById('modal-area').innerHTML='';activeQ=null;
  document.body.style.overflow='';
}
function renderSummary(){
  const rows=[];
  QUESTS.forEach(q=>{
    if(q.special==='nodrink'){
      const ans=D.nodrink[TDK];
      if(ans)rows.push(`<div class="rec-row">${q.icon}<span style="color:#f0c040">禁酒</span>▶<span class="rv">${ans==='yes'?'達成':'飲酒'}</span></div>`);
      return;
    }
    const qr=D.subRec[TDK][q.id];if(!qr)return;
    q.subs.forEach(s=>{
      const sr=qr[s.id];if(!sr||!sr._done)return;
      const vals=s.fields.map(f=>sr[f.k]?f.l+':'+sr[f.k]:'').filter(Boolean).join(' / ');
      rows.push(`<div class="rec-row">${q.icon}<span style="color:#f0c040">${q.name}</span>▶${s.icon}${s.name} <span class="rv">${vals||'完了'}</span></div>`);
    });
  });
  document.getElementById('rec-list').innerHTML=rows.length?rows.join(''):'<div style="font-size:9px;color:#4a3a6a">クエストをこなして記録しよう</div>';
}

function renderCal(){
  const isAbs=calQ==='nodrink';
  const q=isAbs?null:QUESTS.find(x=>x.id===calQ);
  const y=calView.getFullYear(),m=calView.getMonth();
  document.getElementById('cal-ttl').textContent=y+'年'+(m+1)+'月【'+(isAbs?'禁酒':q.name)+'】';
  const first=new Date(y,m,1).getDay();
  const last=new Date(y,m+1,0).getDate();
  let mc=0;
  if(!isAbs)for(let i=1;i<=31;i++){const d=new Date(y,m,i);if(d.getMonth()!==m)break;const r=D.subRec[dk(d)]?.[calQ];if(r&&Object.values(r).some(s=>s&&s._done))mc++;}
  let h='';
  for(let i=0;i<first;i++)h+='<div class="cd"></div>';
  for(let dd=1;dd<=last;dd++){
    const date=new Date(y,m,dd);
    const isT=dk(date)===TDK;
    let cls='cd';
    let statusText='';
    if(isAbs){
      const ans=D.nodrink[dk(date)];
      if(ans==='yes'){cls+=' abs-yes';statusText='禁酒';}
      else if(ans==='no'){cls+=' abs-no';statusText='飲酒';}
    }
    else{
      const r=D.subRec[dk(date)]?.[calQ];
      const done=r&&Object.values(r).some(s=>s&&s._done);
      if(done){
        if(mc<=5)cls+=' c1';
        else if(mc<=12)cls+=' c2';
        else if(mc<=20)cls+=' c3';
        else cls+=' call';
        statusText='達成';
      }
    }
    if(isT)cls+=' today';
    h+=`<div class="${cls}"><span class="c-num">${dd}</span><span class="c-status">${statusText}</span></div>`;
  }
  document.getElementById('cgrid').innerHTML=h;
  document.getElementById('ctabs').innerHTML=QUESTS.map(q=>`<button class="ctab${calQ===q.id?' active':''}" onclick="calQ='${q.id}';Sound.play('select');renderCal()">${q.special==='nodrink'?'禁酒':q.name}</button>`).join('');
  renderCalStats();
}
function renderCalStats(){
  const isAbs=calQ==='nodrink';
  const q=isAbs?null:QUESTS.find(x=>x.id===calQ);
  const ttlEl=document.getElementById('cal-stats-ttl');
  const statsEl=document.getElementById('abs-stats');
  if(isAbs){
    ttlEl.textContent='▼ 禁酒記録';
    const wk=getAbsWeek(),mo=getAbsMonth(),tot=getTotalAbs(),streak=getAbsStreak();
    statsEl.innerHTML=[
      ['今週',wk],['今月',mo],['連続',streak],['累計',tot]
    ].map(([l,v])=>`<div style="flex:1;background:#1a0a2e;border:1px solid #4a3a6a;padding:6px;text-align:center;min-width:60px">
      <div style="font-size:16px;color:#f0c040">${v}</div><div style="font-size:9px;color:#6a5a4a">${l}</div></div>`).join('');
  } else {
    ttlEl.textContent='▼ ' + q.name + '記録';
    const wk=getQuestWeekCount(calQ),mo=getQuestMonthCount(calQ),tot=getQuestTotalCount(calQ);
    statsEl.innerHTML=[
      ['今週',wk],['今月',mo],['累計',tot]
    ].map(([l,v])=>`<div style="flex:1;background:#1a0a2e;border:1px solid #4a3a6a;padding:6px;text-align:center;min-width:60px">
      <div style="font-size:16px;color:#f0c040">${v}</div><div style="font-size:9px;color:#6a5a4a">${l}</div></div>`).join('');
  }
}

function getWkKey(){const d=new Date(TODAY);d.setDate(d.getDate()-d.getDay());return dk(d);}
function getMoKey(){return TODAY.getFullYear()+'-'+(TODAY.getMonth()+1);}
function getNextMoKey(){const d=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,1);return d.getFullYear()+'-'+(d.getMonth()+1);}
function getQuestWeekCount(qid){const d=new Date(TODAY);d.setDate(d.getDate()-d.getDay());let c=0;for(let i=0;i<7;i++){const dd=new Date(d);dd.setDate(d.getDate()+i);const r=D.subRec[dk(dd)]?.[qid];if(r&&Object.values(r).some(s=>s&&s._done))c++;}return c;}
function getQuestMonthCount(qid){let c=0;const y=TODAY.getFullYear(),m=TODAY.getMonth();for(let i=1;i<=31;i++){const d=new Date(y,m,i);if(d.getMonth()!==m)break;const r=D.subRec[dk(d)]?.[qid];if(r&&Object.values(r).some(s=>s&&s._done))c++;}return c;}
function getQuestTotalCount(qid){let c=0;Object.keys(D.subRec).forEach(d=>{const r=D.subRec[d]?.[qid];if(r&&Object.values(r).some(s=>s&&s._done))c++;});return c;}

function isGoalDayWeek(){return TODAY.getDay()===0;}
function isGoalDayMonth(){const last=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0).getDate();return TODAY.getDate()===last;}
function nextSundayLabel(){
  const d=new Date(TODAY);
  d.setDate(d.getDate()+(7-d.getDay()));
  return(d.getMonth()+1)+'/'+d.getDate();
}
function monthEndLabel(){
  const last=new Date(TODAY.getFullYear(),TODAY.getMonth()+1,0);
  return(last.getMonth()+1)+'/'+last.getDate();
}
function showMissionBanner(type){
  const isWeekly=type==='weekly';
  Sound.play('levelUp');
  document.getElementById('mission-area').innerHTML=`
    <div class="mission-flash"></div>
    <div class="mission-overlay" onclick="closeMissionBanner('${type}',false)">
      <div class="mission-card">
        <div class="mission-title${isWeekly?'':' monthly'}">【${isWeekly?'Weekly Mission!!':'Monthly Mission!!'}】</div>
        <div class="mission-sub">${isWeekly?'来週の目標を設定せよ！！':'来月の目標を設定せよ！！'}</div>
        <button class="mission-btn" onclick="event.stopPropagation();closeMissionBanner('${type}',true)">▶ 目標を設定する</button>
      </div>
    </div>`;
}
function closeMissionBanner(type,goToGoals){
  Sound.play('confirm');
  if(type==='weekly')D.weeklyMissionShown[TDK]=true;
  else D.monthlyMissionShown[TDK]=true;
  sv();
  document.getElementById('mission-area').innerHTML='';
  if(goToGoals)sw('goals');
  checkMissionQueue();
}
function checkMissionQueue(){
  if(isGoalDayWeek()&&!D.weeklyMissionShown[TDK]){showMissionBanner('weekly');return;}
  if(isGoalDayMonth()&&!D.monthlyMissionShown[TDK]){showMissionBanner('monthly');return;}
}
function goalRowHtml(prefix,id,icon,name,target,actual,unit,locked){
  const t=target||0;
  const pct=t>0?Math.min(100,Math.round(actual/t*100)):0;
  const achieved=t>0&&actual>=t;
  return`<div class="grow${achieved?' achieved':''}">
    <div class="gr">
      <div class="glbl">${icon}${name}</div>
      <input class="ri" type="number" id="${prefix}-${id}" value="${target||''}" placeholder="0"${locked?' disabled':''}>
      <div class="gunit">${unit}</div>
      <div class="gprog">${achieved?'★達成！':''}</div>
    </div>
    <div class="gr-bar-wrap">
      <div class="bbg"><div class="bf gr-bar-fill" style="width:${pct}%"></div></div>
      <div class="gr-bar-txt">${t>0?actual+'/'+t+'（'+pct+'%）':'実績'+actual}</div>
    </div>
  </div>`;
}
function renderGoalInputs(){
  const wk=getWkKey();
  const qs=QUESTS.filter(q=>q.special!=='nodrink');
  const wkG=D.wk[wk]||{};
  const wkLocked=!isGoalDayWeek(),moLocked=!isGoalDayMonth();
  const moKeyToUse=moLocked?getMoKey():getNextMoKey();
  const moG=D.mo[moKeyToUse]||{};

  document.getElementById('wk-lock').innerHTML=wkLocked
    ?`<div class="lock-banner">🔒 週間目標は毎週日曜日だけ設定できます。次回:${nextSundayLabel()}</div>`
    :`<div class="rulehint">📅 今日は日曜日！今週の目標を決めよう</div>`;
  document.getElementById('mo-lock').innerHTML=moLocked
    ?`<div class="lock-banner">🔒 月間目標は毎月月末だけ設定できます。次回:${monthEndLabel()}</div>`
    :`<div class="rulehint">📅 今日は月末！来月に向けた目標を決めよう</div>`;
  document.getElementById('mo-ptl').textContent=moLocked?'▼ 今月の目標':'▼ 来月の目標';

  document.getElementById('wk-inp').innerHTML=
    qs.map(q=>goalRowHtml('wk',q.id,q.icon,q.name,wkG[q.id],getQuestWeekCount(q.id),'回/週',wkLocked)).join('')+
    goalRowHtml('wk','nodrink','🚫','禁酒',wkG.nodrink,getAbsWeek(),'日/週',wkLocked);
  document.getElementById('mo-inp').innerHTML=
    qs.map(q=>goalRowHtml('mo',q.id,q.icon,q.name,moG[q.id],moLocked?getQuestMonthCount(q.id):0,'回/月',moLocked)).join('')+
    goalRowHtml('mo','nodrink','🚫','禁酒',moG.nodrink,moLocked?getAbsMonth():0,'日/月',moLocked);

  const wkBtn=document.getElementById('wk-save-btn');
  wkBtn.disabled=wkLocked;
  wkBtn.style.opacity=wkLocked?'.35':'1';
  wkBtn.style.cursor=wkLocked?'not-allowed':'pointer';
  const moBtn=document.getElementById('mo-save-btn');
  moBtn.disabled=moLocked;
  moBtn.style.opacity=moLocked?'.35':'1';

    `<button class="rbtn" onclick="addBossRow();Sound.play('select')" style="font-size:10px">+ BOSSを追加</button>`;

  document.getElementById('boss-status').innerHTML=D.boss.filter(g=>g.name).map((g,i)=>{
    const pwr=Math.min(100,Math.round(tot/(30*(i+1))*100));

    </div>`;
  }).join('')||'<div style="font-size:9px;color:#4a3a6a">BOSSを設定してください</div>';

// --- レーダーチャート用ロジック ---
function getCumulativeCountBefore(targetQid, beforeDateStr) {
  let c = 0;
  if (targetQid === 'nodrink') {
    Object.entries(D.nodrink).forEach(([day, val]) => {
      if (val === 'yes' && day < beforeDateStr) {
        c++;
      }
    });
  } else {
    Object.entries(D.subRec).forEach(([day, rec]) => {
      if (day < beforeDateStr) {
        const qr = rec[targetQid];
        if (qr) {
          Object.values(qr).forEach(s => {
            if (s && s._done) c++;
          });
        }
      }
    });
  }
  return c;
}

function getCumulativeCountAll(targetQid) {
  let c = 0;
  if (targetQid === 'nodrink') {
    Object.values(D.nodrink).forEach(val => {
      if (val === 'yes') c++;
    });
  } else {
    Object.values(D.subRec).forEach(rec => {
      const qr = rec[targetQid];
      if (qr) {
        Object.values(qr).forEach(s => {
          if (s && s._done) c++;
        });
      }
    });
  }
  return c;
}

function getStatusValue(statusName, type) {
  // 今週の日曜日を取得
  const today = new Date(TODAY);
  const sun = new Date(today);
  sun.setDate(today.getDate() - today.getDay());
  const sunStr = dk(sun); // YYYY-MM-DD
  
  const base = STATS_BASE[statusName] || 0;
  let count = 0;
  
  Object.entries(STATS_MAP).forEach(([qid, statName]) => {
    if (statName === statusName) {
      if (type === 'lastWeek') {
        count += getCumulativeCountBefore(qid, sunStr);
      } else {
        count += getCumulativeCountAll(qid);
      }
    }
  });
  
  return base + count;
}

let statusChartInstance = null;
function renderStatusChart() {
  const canvas = document.getElementById('statusChart');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  
  const labels = Object.keys(STATS_BASE);
  const lastWeekData = labels.map(label => getStatusValue(label, 'lastWeek'));
  const thisWeekData = labels.map(label => getStatusValue(label, 'thisWeek'));
  
  if (statusChartInstance) {
    statusChartInstance.destroy();
  }
  
  statusChartInstance = new Chart(ctx, {
    type: 'radar',
    data: {
      labels: labels,
      datasets: [
        {
          label: '前週のステータス',
          data: lastWeekData,
          backgroundColor: 'rgba(64, 128, 240, 0.25)',
          borderColor: '#4080f0',
          borderWidth: 2,
          pointBackgroundColor: '#4080f0',
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#4080f0'
        },
        {
          label: '今週のステータス',
          data: thisWeekData,
          backgroundColor: 'rgba(240, 192, 64, 0.35)',
          borderColor: '#f0c040',
          borderWidth: 2,
          pointBackgroundColor: '#f0c040',
          pointBorderColor: '#fff',
          pointHoverBackgroundColor: '#fff',
          pointHoverBorderColor: '#f0c040'
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      scales: {
        r: {
          angleLines: {
            color: 'rgba(74, 58, 106, 0.8)'
          },
          grid: {
            color: 'rgba(74, 58, 106, 0.8)'
          },
          pointLabels: {
            color: '#f0e6c8',
            font: {
              family: "'DotGothic16', monospace",
              size: 10
            }
          },
          ticks: {
            display: false,
            stepSize: 10
          }
        }
      },
      plugins: {
        legend: {
          labels: {
            color: '#f0e6c8',
            font: {
              family: "'DotGothic16', monospace",
              size: 10
            }
          }
        }
      }
    }
  });
}
